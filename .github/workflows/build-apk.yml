name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

env:
  GRADLE_OPTS: "-Xmx2048m -Dfile.encoding=UTF-8"
  JAVA_VERSION: "17"
  ANDROID_SDK_VERSION: "34"
  ANDROID_BUILD_TOOLS: "34.0.0"

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          api-level: ${{ env.ANDROID_SDK_VERSION }}
          build-tools-version: ${{ env.ANDROID_BUILD_TOOLS }}

      - name: Build Release APK (debug-signed)
        run: ./gradlew assembleRelease --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK=$(find . -name "*.apk" -path "*/release/*" | head -1)
          if [ -z "$APK" ]; then
            APK=$(find . -name "*.apk" | head -1)
          fi
          if [ -z "$APK" ]; then
            echo "No APK found"
            exit 1
          fi
          echo "APK=$APK" >> "$GITHUB_OUTPUT"
          echo "Found: $APK"
          ls -lh "$APK"

      - name: Rename APK
        id: rename
        run: |
          SRC="${{ steps.apk.outputs.APK }}"
          DEST="ReaBuzz-Admin-$(date +%Y%m%d-%H%M).apk"
          cp "$SRC" "$DEST"
          echo "renamed=$DEST" >> "$GITHUB_OUTPUT"
          ls -lh "$DEST"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ steps.rename.outputs.renamed }}
          retention-days: 30
