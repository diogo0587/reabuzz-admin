name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.0.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  GRADLE_OPTS: "-Xmx2048m -Dfile.encoding=UTF-8"
  JAVA_VERSION: "17"
  ANDROID_BUILD_TOOLS: "34.0.0"
  ANDROID_PLATFORM: "android-34"

jobs:
  release:
    name: Build & Publish Signed Release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK platform and build-tools
        run: sdkmanager "${{ env.ANDROID_PLATFORM }}" "build-tools;${{ env.ANDROID_BUILD_TOOLS }}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      # Fail early. build.gradle falls back to the debug keystore when
      # RELEASE_STORE_FILE is unset, which keeps CI green but must never be
      # published as a release.
      - name: Require signing secrets
        env:
          RELEASE_STORE_FILE: ${{ secrets.RELEASE_STORE_FILE }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=0
          for name in RELEASE_STORE_FILE RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "A release needs a real keystore. Add these repository secrets:"
            echo "  RELEASE_STORE_FILE      base64 of the .jks file"
            echo "  RELEASE_STORE_PASSWORD  keystore password"
            echo "  RELEASE_KEY_ALIAS       key alias"
            echo "  RELEASE_KEY_PASSWORD    key password"
            exit 1
          fi

      - name: Decode keystore
        env:
          RELEASE_STORE_FILE: ${{ secrets.RELEASE_STORE_FILE }}
        run: |
          echo "$RELEASE_STORE_FILE" | base64 -d > keystore.jks
          ls -lh keystore.jks

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build signed release APK
        env:
          RELEASE_STORE_FILE: keystore.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify signature
        id: verify
        run: |
          set -euo pipefail
          BT="${ANDROID_HOME}/build-tools/${{ env.ANDROID_BUILD_TOOLS }}"
          APK=$(find build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$APK"
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          "$BT/aapt2" dump badging "$APK" | grep -E "^package:|^launchable-activity:"
          if "$BT/apksigner" verify --print-certs "$APK" | grep -q "CN=Android Debug"; then
            echo "APK is debug-signed; refusing to publish it as a release"
            exit 1
          fi
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Name artifact and checksum
        id: package
        run: |
          NAME="ReaBuzzAdmin-${{ steps.version.outputs.version }}.apk"
          cp "${{ steps.verify.outputs.apk }}" "$NAME"
          sha256sum "$NAME" | tee "$NAME.sha256"
          ls -lh "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: reabuzz-admin-release-${{ steps.version.outputs.version }}
          path: |
            ${{ steps.package.outputs.name }}
            ${{ steps.package.outputs.name }}.sha256
          retention-days: 90

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', steps.version.outputs.version) || github.ref_name }}
          name: ReaBuzz Admin ${{ steps.version.outputs.version }}
          draft: false
          prerelease: ${{ inputs.prerelease == true }}
          generate_release_notes: true
          files: |
            ${{ steps.package.outputs.name }}
            ${{ steps.package.outputs.name }}.sha256
