name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_OPTS: "-Xmx2048m -Dfile.encoding=UTF-8"
  JAVA_VERSION: "17"
  ANDROID_BUILD_TOOLS: "34.0.0"
  ANDROID_PLATFORM: "android-34"

jobs:
  verify:
    name: Build, Test & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK platform and build-tools
        run: sdkmanager "${{ env.ANDROID_PLATFORM }}" "build-tools;${{ env.ANDROID_BUILD_TOOLS }}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: build/reports/tests/testDebugUnitTest/
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: build/reports/lint-results-debug.html
          retention-days: 14

  apk:
    name: Package APK
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK platform and build-tools
        run: sdkmanager "${{ env.ANDROID_PLATFORM }}" "build-tools;${{ env.ANDROID_BUILD_TOOLS }}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify the APK is signed and launchable
        run: |
          set -euo pipefail
          BT="${ANDROID_HOME}/build-tools/${{ env.ANDROID_BUILD_TOOLS }}"
          APK=$(find build/outputs/apk/debug -name '*.apk' | head -1)
          test -n "$APK"
          ls -lh "$APK"
          "$BT/apksigner" verify --print-certs "$APK"
          "$BT/aapt2" dump badging "$APK" | grep -E "^package:|^launchable-activity:"

      - name: Rename APK
        id: rename
        run: |
          SRC=$(find build/outputs/apk/debug -name '*.apk' | head -1)
          DEST="ReaBuzzAdmin-debug-${GITHUB_SHA::7}.apk"
          cp "$SRC" "$DEST"
          echo "apk=$DEST" >> "$GITHUB_OUTPUT"
          ls -lh "$DEST"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: reabuzz-admin-debug-apk
          path: ${{ steps.rename.outputs.apk }}
          retention-days: 30
