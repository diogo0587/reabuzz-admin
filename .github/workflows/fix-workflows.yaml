name: Fix Workflows (one-shot)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    name: Auto-fix GitHub Actions workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          mv actionlint /usr/local/bin/actionlint
          actionlint --version

      - name: Backup original workflows
        run: |
          mkdir -p /tmp/wf-backup
          cp -r .github/workflows/* /tmp/wf-backup/ || true
          echo "✅ Backup saved to /tmp/wf-backup"

      - name: Fix setup-android @v3 -> @v4
        run: |
          shopt -s nullglob
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            sed -i 's#android-actions/setup-android@v3#android-actions/setup-android@v4#g' "$f"
            echo "✅ Patched setup-android in $f"
          done

      - name: Fix secrets-in-if warnings
        run: |
          shopt -s nullglob
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            # Troca "if: ${{ secrets.X != '' }}" por run com check interno
            # Estratégia conservadora: apenas remove o "if:" e deixa o step
            # rodar sempre, com guard dentro do run.
            python3 - "$f" <<'PY'
import re, sys, pathlib

p = pathlib.Path(sys.argv[1])
text = p.read_text()
orig = text

# Padrão: steps com if: ${{ secrets.FOO != '' }} e env: com o mesmo secret
# Vamos transformar em: sem if, com guard no run.
pattern = re.compile(
    r"(?P<indent>[ ]{6})- name: (?P<name>[^\n]+)\n"
    r"(?P=indent)  if: \$\{\{ secrets\.(?P<sec>[A-Z0-9_]+) != '' \}\}\n"
    r"(?P=indent)  env:\n"
    r"(?P=indent)    (?P=sec): \$\{\{ secrets\.(?P=sec) \}\}\n"
    r"(?P=indent)  run: \|\n"
    r"(?P<body>(?:(?P=indent)    [^\n]*\n)+)",
    re.MULTILINE,
)

def repl(m):
    indent = m.group("indent")
    name = m.group("name")
    sec = m.group("sec")
    body = m.group("body")
    # Reescreve o body com guard no topo
    new_body = (
        f"{indent}    if [ -z \"${{{sec}:-}}\" ]; then\n"
        f"{indent}      echo \"⚠️  {sec} not set — skipping {name}\"\n"
        f"{indent}      exit 0\n"
        f"{indent}    fi\n"
        + body
    )
    return (
        f"{indent}- name: {name}\n"
        f"{indent}  env:\n"
        f"{indent}    {sec}: ${{{{ secrets.{sec} }}}}\n"
        f"{indent}  run: |\n"
        f"{new_body}"
    )

new = pattern.sub(repl, text)
if new != orig:
    p.write_text(new)
    print(f"✅ Fixed secrets-in-if in {p}")
else:
    print(f"ℹ️  No secrets-in-if pattern in {p}")
PY
          done

      - name: Quote GITHUB_OUTPUT / GITHUB_PATH redirects
        run: |
          shopt -s nullglob
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            # Aspas simples em $GITHUB_OUTPUT, $GITHUB_PATH, $GITHUB_STEP_SUMMARY, $GITHUB_ENV
            sed -i -E 's#>> \$GITHUB_OUTPUT#>> "$GITHUB_OUTPUT"#g' "$f"
            sed -i -E 's#>> \$GITHUB_PATH#>> "$GITHUB_PATH"#g' "$f"
            sed -i -E 's#>> \$GITHUB_STEP_SUMMARY#>> "$GITHUB_STEP_SUMMARY"#g' "$f"
            sed -i -E 's#>> \$GITHUB_ENV#>> "$GITHUB_ENV"#g' "$f"
            # Aspas em variáveis soltas comuns (best-effort)
            sed -i -E 's#>> \$([A-Z_]+)$#>> "$\1"#g' "$f" || true
            echo "✅ Quoted redirects in $f"
          done

      - name: Collapse consecutive echo >> GITHUB_OUTPUT (SC2129)
        run: |
          shopt -s nullglob
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            python3 - "$f" <<'PY'
import re, sys, pathlib

p = pathlib.Path(sys.argv[1])
text = p.read_text()
orig = text

# Agrupa linhas consecutivas:  echo "X" >> "$GITHUB_OUTPUT"
# (com mesma indentação e sem linhas em branco entre elas)
lines = text.splitlines()
out = []
i = 0
indent_re = re.compile(r'^(\s*)echo ".*" >> "\$GITHUB_OUTPUT"\s*$')

while i < len(lines):
    m = indent_re.match(lines[i])
    if not m:
        out.append(lines[i])
        i += 1
        continue
    indent = m.group(1)
    group = []
    while i < len(lines):
        m2 = indent_re.match(lines[i])
        if not m2 or m2.group(1) != indent:
            break
        # extrai o conteúdo do echo
        content = re.search(r'echo "(.*)" >>', lines[i]).group(1)
        group.append(content)
        i += 1
    if len(group) == 1:
        out.append(f'{indent}echo "{group[0]}" >> "$GITHUB_OUTPUT"')
    else:
        out.append(f'{indent}{{')
        for c in group:
            out.append(f'{indent}  echo "{c}"')
        out.append(f'{indent}}} >> "$GITHUB_OUTPUT"')

new = "\n".join(out) + ("\n" if text.endswith("\n") else "")
if new != orig:
    p.write_text(new)
    print(f"✅ Collapsed redirects in {p}")
else:
    print(f"ℹ️  No consecutive redirects in {p}")
PY
          done

      - name: Validate with actionlint
        run: |
          echo "🔍 Running actionlint on all workflows..."
          shopt -s nullglob
          files=(.github/workflows/*.yml .github/workflows/*.yaml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "⚠️  No workflow files found"
            exit 0
          fi
          actionlint -color "${files[@]}"
          echo "✅ actionlint passed"

      - name: Show diff
        run: |
          echo "===== DIFF ====="
          git diff --stat
          echo ""
          git --no-pager diff

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "ℹ️  No changes to commit"
            exit 0
          fi

          git add .github/workflows/
          git commit -m "ci: auto-fix workflow issues (setup-android@v4, quoted redirects, secrets-in-if)

          - Bump android-actions/setup-android @v3 -> @v4 (fixes 'Failed to find package tools')
          - Move secrets checks from 'if:' into run guards (actionlint warning)
          - Quote \$GITHUB_OUTPUT / \$GITHUB_PATH / \$GITHUB_STEP_SUMMARY (SC2086)
          - Collapse consecutive redirects into { ...; } >> file (SC2129)
          - Validate with actionlint before committing"

          git push
          echo "✅ Changes pushed"
