name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        type: string
      is_prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

env:
  GRADLE_OPTS: "-Xmx2048m -Dfile.encoding=UTF-8"
  JAVA_VERSION: "17"
  ANDROID_SDK_VERSION: "34"
  ANDROID_BUILD_TOOLS: "34.0.0"
  ANDROID_NDK_VERSION: "26.1.10909125"
  CMAKE_VERSION: "3.22.1"

jobs:
  # ============================================================
  # VALIDATE & BUILD RELEASE
  # ============================================================
  build-and-validate:
    name: Build & Validate Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      apk_path: ${{ steps.rename.outputs.renamed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: ${{ env.ANDROID_SDK_VERSION }}
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}
          cmake-version: ${{ env.CMAKE_VERSION }}
          build-tools-version: ${{ env.ANDROID_BUILD_TOOLS }}

      - name: Add build-tools to PATH
        run: echo "${ANDROID_HOME}/build-tools/${{ env.ANDROID_BUILD_TOOLS }}" >> "$GITHUB_PATH"

      - name: Require Signing Secrets
        env:
          RELEASE_STORE_FILE: ${{ secrets.RELEASE_STORE_FILE }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=0
          for s in RELEASE_STORE_FILE RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!s:-}" ]; then
              echo "❌ Missing secret: $s"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo ""
            echo "Release builds REQUIRE a signed keystore."
            echo "Configure RELEASE_STORE_FILE (base64), RELEASE_STORE_PASSWORD,"
            echo "RELEASE_KEY_ALIAS and RELEASE_KEY_PASSWORD in repository secrets."
            exit 1
          fi
          echo "✅ All signing secrets present"

      - name: Setup Signing Key
        env:
          RELEASE_STORE_FILE: ${{ secrets.RELEASE_STORE_FILE }}
        run: |
          echo "$RELEASE_STORE_FILE" | base64 -d > keystore.jks
          ls -lh "keystore.jks"

      - name: Extract Version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          if [ -z "$VERSION" ]; then
            echo "❌ Could not determine version"
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "tag=v$VERSION"
          } >> "$GITHUB_OUTPUT"
          echo "✅ Version: $VERSION"

      - name: Update Version in Build Config
        run: |
          VCODE=$(git rev-list --count HEAD)
          for f in build.gradle build.gradle.kts; do
            if [ -f "$f" ]; then
              sed -i "s/versionName \".*\"/versionName \"${{ steps.version.outputs.version }}\"/" "$f"
              sed -i "s/versionCode .*/versionCode $VCODE/" "$f"
              echo "✅ Updated $f (versionCode=$VCODE)"
            fi
          done

      - name: Run All Tests
        run: ./gradlew test lint --stacktrace --continue

      - name: Build Release APK (signed)
        env:
          RELEASE_STORE_FILE: keystore.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Locate APK
        id: verify
        run: |
          APK_PATH=$(find . -name "*.apk" -path "*/release/*" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ No release APK found!"
            exit 1
          fi
          {
            echo "APK_PATH=$APK_PATH"
          } >> "$GITHUB_OUTPUT"
          echo "✅ APK: $APK_PATH"
          ls -lh "$APK_PATH"

      - name: Verify APK Signature (strict)
        run: |
          APK="${{ steps.verify.outputs.APK_PATH }}"
          echo "🔐 Verifying signature (must be signed)..."
          apksigner verify --verbose --print-certs "$APK"
          if ! apksigner verify "$APK" 2>/dev/null; then
            echo "❌ APK is NOT signed. Release builds must be signed."
            exit 1
          fi
          echo "✅ APK signature verified"

      - name: Rename APK
        id: rename
        run: |
          SRC="${{ steps.verify.outputs.APK_PATH }}"
          DEST="ReaBuzz-Admin-v${{ steps.version.outputs.version }}.apk"
          cp "$SRC" "$DEST"
          {
            echo "renamed=$DEST"
          } >> "$GITHUB_OUTPUT"
          ls -lh "$DEST"

      - name: Generate Checksums
        id: checksums
        run: |
          APK="${{ steps.rename.outputs.renamed }}"
          SHA256=$(sha256sum "$APK" | cut -d' ' -f1)
          SHA512=$(sha512sum "$APK" | cut -d' ' -f1)
          MD5=$(md5sum "$APK" | cut -d' ' -f1)
          {
            echo "sha256=$SHA256"
            echo "sha512=$SHA512"
            echo "md5=$MD5"
          } >> "$GITHUB_OUTPUT"
          echo "✅ sha256=$SHA256"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ steps.version.outputs.version }}
          path: ${{ steps.rename.outputs.renamed }}
          retention-days: 90

      - name: Generate Release Notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"

          cat <<EOF > release_notes.md
          # ReaBuzz Admin v${VERSION}

          ## 📱 Android Application Release

          **Release Date**: $(date -u +"%Y-%m-%d %H:%M UTC")
          **Version**: ${VERSION}
          **Tag**: ${TAG}
          **Commit**: ${GITHUB_SHA::8}

          ## ✨ Features
          - Modern Android app with Kotlin + Jetpack Compose
          - Role-based admin dashboard (ADMIN/MODERATOR/USER)
          - Secure authentication with JWT + EncryptedSharedPreferences
          - Audit logging for all administrative actions
          - Material3 theming with dark mode support
          - Certificate pinning for network security

          ## 🔐 Security
          - Server-side authorization (no local flags)
          - Encrypted token storage
          - Certificate pinning configured
          - ProGuard/R8 obfuscation enabled
          - No backup/debug flags in release

          ## 📦 Download
          - **APK**: \`ReaBuzz-Admin-v${VERSION}.apk\`
          - **SHA256**: \`${{ steps.checksums.outputs.sha256 }}\`

          ## 📋 Verification
          \`\`\`bash
          apksigner verify --print-certs ReaBuzz-Admin-v${VERSION}.apk
          sha256sum -c <<< "${{ steps.checksums.outputs.sha256 }}  ReaBuzz-Admin-v${VERSION}.apk"
          \`\`\`

          ## 🛠️ Build Info
          - **Gradle**: 8.4
          - **Kotlin**: 1.9+
          - **Android SDK**: 34
          - **Min SDK**: 21 (Android 5.0)
          - **Target SDK**: 34 (Android 14)
          - **Arch**: arm64-v8a, armeabi-v7a

          ---
          *Built from commit ${GITHUB_SHA} on GitHub Actions*
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ReaBuzz Admin v${{ steps.version.outputs.version }}${{ inputs.is_prerelease && ' (Pre-release)' || '' }}
          body_path: release_notes.md
          files: ${{ steps.rename.outputs.renamed }}
          draft: false
          prerelease: ${{ inputs.is_prerelease == true }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
