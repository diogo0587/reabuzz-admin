name: Fix Workflows (one-shot)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    name: Bump setup-android to v4
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          mv actionlint /usr/local/bin/actionlint
          actionlint --version

      - name: Backup workflows
        run: |
          mkdir -p /tmp/wf-backup
          cp -r .github/workflows/* /tmp/wf-backup/ || true
          echo "Backup saved to /tmp/wf-backup"

      - name: Bump setup-android v3 -> v4
        run: |
          shopt -s nullglob
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            sed -i 's#android-actions/setup-android@v3#android-actions/setup-android@v4#g' "$f"
            echo "Patched setup-android in $f"
          done

      - name: Validate with actionlint
        run: |
          echo "Running actionlint on all workflows..."
          shopt -s nullglob
          files=(.github/workflows/*.yml .github/workflows/*.yaml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No workflow files found"
            exit 0
          fi
          actionlint -color "${files[@]}"
          echo "actionlint passed"

      - name: Show diff
        run: |
          echo "===== DIFF ====="
          git diff --stat
          echo ""
          git --no-pager diff

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git add .github/workflows/
          git commit -m "ci: bump setup-android v3 -> v4 (fix sdkmanager 'tools' error)"
          git push
          echo "Changes pushed"
